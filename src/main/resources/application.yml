spring:
  application:
    name: nubi-server
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nubi}
    username: ${DATABASE_USERNAME:nubi}
    password: ${DATABASE_PASSWORD:nubi}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

nubi:
  public-api-key: ${NUBI_PUBLIC_API_KEY:}
