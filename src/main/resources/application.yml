spring:
  application:
    name: nubi-server
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nubi}
    username: ${DATABASE_USERNAME:nubi}
    password: ${DATABASE_PASSWORD:nubi}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

nubi:
  gwangju:
    data-source: ${GWANGJU_BUS_DATA_SOURCE:observed-web-api}
    api-key: ${GWANGJU_BUS_API_KEY:}
    observed-base-url: ${GWANGJU_BUS_OBSERVED_BASE_URL:https://bus.gwangju.go.kr}
    official-base-url: ${GWANGJU_BUS_OFFICIAL_BASE_URL:}
    collection-enabled: ${GWANGJU_BUS_COLLECT_ON_STARTUP:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
