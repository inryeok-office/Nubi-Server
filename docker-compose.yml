services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nubi}
      POSTGRES_USER: ${POSTGRES_USER:-nubi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nubi}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nubi-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nubi-postgres-data:
